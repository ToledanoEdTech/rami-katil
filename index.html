
<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#020617" />
    <!-- תגיות PWA מעודכנות -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.json" />
    <title>רמי וקטיל - אלוף הארמית</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- הוספת Babel כדי לאפשר הרצת TSX ישירות ב-GitHub Pages -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Rubik:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
      body {
        font-family: 'Rubik', sans-serif;
        background-color: #020617;
        overflow: hidden;
        margin: 0;
        padding: 0;
        color: white;
      }
      #loading-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #020617;
        z-index: 9999;
        transition: opacity 0.5s;
      }
      .spinner {
        width: 50px;
        height: 50px;
        border: 5px solid rgba(251, 191, 36, 0.1);
        border-top: 5px solid #fbbf24;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client?deps=react@18.2.0",
    "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
  </head>
  <body>
    <div id="loading-screen">
      <div class="spinner"></div>
      <p style="margin-top: 20px; font-weight: bold; color: #fbbf24;">מתכונן לקרב...</p>
    </div>
    <div id="root"></div>

    <!-- שימוש ב-Babel כדי לעקוף את שגיאת ה-MIME של השרת -->
    <script type="text/babel" data-type="module" src="./index.tsx"></script>

    <script>
      // מזהה שגיאות לפני שהאפליקציה עולה
      window.onerror = function(msg, url, line) {
        const loader = document.getElementById('loading-screen');
        if (loader) {
          loader.innerHTML = `
            <div style="padding: 20px; text-align: center; color: #ef4444;">
              <h2 style="font-size: 24px; font-weight: bold;">שגיאת טעינה</h2>
              <p style="color: white; margin: 10px 0;">השרת חסם את קובץ המשחק (MIME Error).</p>
              <p style="font-size: 11px; opacity: 0.5;">${msg}</p>
              <button onclick="location.reload()" style="margin-top: 20px; background: #fbbf24; color: black; padding: 10px 20px; border-radius: 8px; font-weight: bold;">נסה שוב</button>
            </div>
          `;
        }
        return false;
      };
    </script>
  </body>
</html>
